<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DigitalShop - Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600 tracking-tighter">DIGITAL SHOP</h1>
            <div class="flex items-center gap-4">
                <a href="/profile.html" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition">My Orders</a>
                <a href="/admin.html" id="admin-link" class="hidden bg-amber-100 text-amber-700 px-3 py-1 rounded-lg text-sm font-bold">Admin Panel</a>
                <button id="logout-btn" onclick="logout()" class="text-sm text-red-500 font-bold hover:underline">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex gap-8">
        <div class="flex-1">
            <div id="categories-container" class="flex gap-3 mb-8 overflow-x-auto pb-2">
                <button onclick="loadProducts()" class="bg-indigo-600 text-white px-5 py-2 rounded-full whitespace-nowrap shadow-md hover:bg-indigo-700 transition">All Products</button>
            </div>

            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>

        <aside class="w-80 bg-white p-6 rounded-2xl shadow-xl h-fit sticky top-24 border border-gray-100">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                Your Basket
                <span id="cart-count" class="bg-indigo-100 text-indigo-600 text-xs px-2 py-1 rounded-full">0</span>
            </h2>
            <div id="cart-items" class="space-y-4 mb-6 max-h-96 overflow-y-auto">
                <p class="text-gray-400 text-center py-4">Your basket is empty</p>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button id="checkout-btn" class="w-full bg-black text-white py-4 rounded-xl font-bold hover:bg-gray-800 disabled:bg-gray-200 transition">Place Order</button>
            </div>
        </aside>
    </main>

    <script src="js/shop.js"></script>
</body>
</html>
