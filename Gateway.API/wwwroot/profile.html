<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Order History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .filter-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-black text-gray-900 tracking-tight">Order History</h1>
                <p class="text-gray-500 font-medium">View and manage your recent purchases</p>
            </div>
            <a href="shop.html" class="bg-white border border-gray-200 px-6 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-50 transition">Back to Store</a>
        </div>

        <div class="flex gap-3 mb-8">
            <button onclick="setFilter('all')" id="btn-all" class="filter-btn active border border-gray-200 px-5 py-2 rounded-xl text-sm font-bold transition">All Orders</button>
            <button onclick="setFilter('active')" id="btn-active" class="filter-btn border border-gray-200 px-5 py-2 rounded-xl text-sm font-bold transition text-gray-600">Active</button>
            <button onclick="setFilter('cancelled')" id="btn-cancelled" class="filter-btn border border-gray-200 px-5 py-2 rounded-xl text-sm font-bold transition text-gray-600">Cancelled</button>
        </div>

        <div id="orders-container" class="space-y-6">
            <div class="text-center py-20 text-gray-400">Loading your orders...</div>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
