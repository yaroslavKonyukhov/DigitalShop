services:
  identity-db:
    image: postgres:16
    container_name: identity-postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=identity_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  catalog-db:
    image: postgres:16
    container_name: catalog-postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=catalog_db
    ports:
      - "5433:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data

  ordering-db:
    image: postgres:16
    container_name: ordering-postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=ordering_db
    ports:
      - "5435:5432"
    volumes:
      - ordering_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  identity-api:
    build:
      context: .
      dockerfile: IdentityService/Identity.API/Dockerfile
    container_name: identity-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=identity-db;Port=5432;Database=identity_db;Username=admin;Password=password123
    depends_on:
      - identity-db

  catalog-api:
    build:
      context: .
      dockerfile: CatalogService/Catalog.API/Dockerfile
    container_name: catalog-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=catalog-db;Port=5432;Database=catalog_db;Username=admin;Password=admin_password
      - RabbitMQ__Host=rabbitmq
      - RedisSettings__ConnectionString=redis:6379
    depends_on:
      - catalog-db
      - rabbitmq
      - redis

  ordering-api:
    build:
      context: .
      dockerfile: OrderingService/Ordering.API/Dockerfile
    container_name: ordering-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=ordering-db;Port=5432;Database=ordering_db;Username=admin;Password=admin_password
      - RabbitMQ__Host=rabbitmq
      - ExternalServices__CatalogUrl=http://catalog-api:8080
    depends_on:
      - ordering-db
      - rabbitmq
      - catalog-api

  api-gateway:
    build:
      context: .
      dockerfile: Gateway/Gateway.API/Dockerfile
    container_name: api-gateway
    ports:
      - "5216:8080"
    environment:
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-api:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-api:8080
      - ReverseProxy__Clusters__ordering-cluster__Destinations__destination1__Address=http://ordering-api:8080
    depends_on:
      - identity-api
      - catalog-api
      - ordering-api

volumes:
  postgres_data:
  catalog_data:
  ordering_data: